name: Foster Platform CI

on:
  push:
    branches:
      - feat/foster-platform
    paths:
      - "foster-platform/**"
      - ".github/workflows/foster-platform-ci.yml"
  pull_request:
    paths:
      - "foster-platform/**"
      - ".github/workflows/foster-platform-ci.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: foster
          MYSQL_DATABASE: foster
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfoster"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:foster@127.0.0.1:3307/mysql
    defaults:
      run:
        working-directory: foster-platform
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: foster-platform
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
