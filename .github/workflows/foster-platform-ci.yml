name: Foster Platform CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/foster-platform
    paths:
      - ".github/ci-trigger/foster-platform"

concurrency:
  group: foster-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: foster
          MYSQL_DATABASE: foster
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfoster"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:foster@127.0.0.1:3307/mysql
    defaults:
      run:
        working-directory: foster-platform
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: foster-platform
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compile Python foster bridge
        run: >-
          python -m compileall
          ../module/foster_bridge
          ../module/login_bridge
          ../tasks/KekkaiUtilize/foster_once.py
          ../tasks/KekkaiUtilize/provider_target.py
          ../tasks/KekkaiUtilize/provider_target_test.py
          ../tasks/KekkaiUtilize/script_task.py
          ../tasks/Component/SwitchAccount/login_account.py
          ../module/server/app.py
      - name: Test platform provider targeting
        run: cd .. && python -m unittest tasks.KekkaiUtilize.provider_target_test
      - name: Validate production compose
        run: docker compose --env-file prod.env.example -f docker-compose.prod.yml config > /dev/null
      - name: Validate Windows deployment scripts
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem deploy/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
