name: Build Foster Agent Windows Package

on:
  workflow_dispatch:
    inputs:
      package_label:
        description: Optional human-readable package label
        required: false
        default: manual
  workflow_call:
    inputs:
      package_label:
        description: Package label used by the final verification workflow
        type: string
        required: false
        default: ci

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: foster-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: foster-platform

      - name: Build foster-agent
        run: cargo build --release -p foster-agent

      - name: Package Windows Agent
        shell: pwsh
        env:
          PACKAGE_LABEL: ${{ inputs.package_label }}
        run: |
          $ErrorActionPreference = "Stop"

          $label = $env:PACKAGE_LABEL
          if ([string]::IsNullOrWhiteSpace($label)) {
            $label = "manual"
          }
          $label = ($label -replace '[^A-Za-z0-9._-]', '-').Trim('-')
          if ([string]::IsNullOrWhiteSpace($label)) {
            $label = "manual"
          }

          $packageName = "foster-agent-windows-$label"
          $stagingRoot = Join-Path $PWD "dist"
          $packageDir = Join-Path $stagingRoot $packageName

          Remove-Item -Recurse -Force $stagingRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          Copy-Item "target/release/foster-agent.exe" $packageDir
          Copy-Item "deploy/windows/Start-FosterAgent.ps1" $packageDir
          Copy-Item "deploy/windows/Install-FosterAgentTask.ps1" $packageDir
          Copy-Item "deploy/windows/Test-FosterHost.ps1" $packageDir
          Copy-Item "deploy/windows/agent.env.example" $packageDir

          $exePath = Join-Path $packageDir "foster-agent.exe"
          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exePath).Hash.ToLowerInvariant()
          "$exeHash  foster-agent.exe" |
            Set-Content -LiteralPath (Join-Path $packageDir "foster-agent.exe.sha256") -Encoding ascii

          $metadata = [ordered]@{
            packageLabel = $label
            repository = $env:GITHUB_REPOSITORY
            gitSha = $env:GITHUB_SHA
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunNumber = $env:GITHUB_RUN_NUMBER
            builtAtUtc = [DateTime]::UtcNow.ToString("o")
            rustTarget = "x86_64-pc-windows-msvc"
          }
          $metadata |
            ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $packageDir "build-metadata.json") -Encoding utf8

          $zipPath = Join-Path $stagingRoot "$packageName.zip"
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal

          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          "$zipHash  $packageName.zip" |
            Set-Content -LiteralPath "$zipPath.sha256" -Encoding ascii

          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_ZIP_SHA=$zipPath.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify zip, executable checksum, and packaged scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:PACKAGE_ZIP -PathType Leaf)) {
            throw 'Windows package zip is missing.'
          }
          if (-not (Test-Path -LiteralPath $env:PACKAGE_ZIP_SHA -PathType Leaf)) {
            throw 'Windows package checksum is missing.'
          }
          $zipRow = (Get-Content -LiteralPath $env:PACKAGE_ZIP_SHA -Raw).Trim()
          $zipSha = ($zipRow -split '  ')[0].ToLowerInvariant()
          if ($zipSha.Length -ne 64) { throw 'Invalid zip SHA-256 file.' }
          $actualZipSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:PACKAGE_ZIP).Hash.ToLowerInvariant()
          if ($actualZipSha -ne $zipSha) { throw 'Zip SHA-256 mismatch.' }

          $unpacked = Join-Path $PWD 'dist/verified-package'
          Expand-Archive -LiteralPath $env:PACKAGE_ZIP -DestinationPath $unpacked -Force
          @(
            'foster-agent.exe',
            'foster-agent.exe.sha256',
            'Start-FosterAgent.ps1',
            'Install-FosterAgentTask.ps1',
            'Test-FosterHost.ps1',
            'agent.env.example',
            'build-metadata.json'
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $unpacked $_) -PathType Leaf)) {
              throw "Missing package file: $_"
            }
          }
          $exeRow = (Get-Content -LiteralPath (Join-Path $unpacked 'foster-agent.exe.sha256') -Raw).Trim()
          $exeSha = ($exeRow -split '  ')[0].ToLowerInvariant()
          if ($exeSha.Length -ne 64) { throw 'Invalid executable SHA-256 file.' }
          $actualExeSha = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $unpacked 'foster-agent.exe')).Hash.ToLowerInvariant()
          if ($actualExeSha -ne $exeSha) { throw 'Executable SHA-256 mismatch.' }

          Get-ChildItem -LiteralPath $unpacked -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "Packaged script failed parsing: $($_.Name)"
            }
          }
          Write-Host 'Windows Agent package integrity checks passed.'

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.PACKAGE_ZIP_SHA }}
          if-no-files-found: error
          retention-days: 30
